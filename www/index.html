<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Side Quest</title>
<style>
  html,body{margin:0;height:100%;background:#FBF4E4;color:#211E17;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .logo{font-size:26px;font-weight:700;color:#D66B4E;letter-spacing:-.5px}
  .msg{font-size:14px;color:#6E664F;max-width:260px;line-height:1.5}
  .ring{width:34px;height:34px;border:3px solid #EADFC6;border-top-color:#D66B4E;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="logo">SideQuest</div>
  <div class="ring"></div>
  <div class="msg">Loading… If this screen stays, check your internet connection.</div>
</body>
</html>
